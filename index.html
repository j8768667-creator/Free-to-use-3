<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Chain Melody Companion Pro</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input, button {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="file"] {
      padding: 0.5rem;
      cursor: pointer;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      background-color: #334155;
      color: var(--text-main);
      width: fit-content;
    }

    .status-badge.active {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .visualizer-box {
      height: 80px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    canvas {
      width: 100%;
      height: 160px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: block;
    }

    .log-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Markov Chain Melody Companion Pro</h1>
      <p>Poly-Rhythmic & Expressive Probabilistic Sequence Synthesizer</p>
    </header>

    <div class="card">
      <h3>1. Training Input Source</h3>
      <div class="grid">
        <div class="form-group">
          <label for="midi-file">Upload MIDI Files (Select Multiple)</label>
          <input type="file" id="midi-file" accept=".mid,.midi" multiple>
        </div>
        <div class="form-group">
          <label for="preset-select">Or Load Built-In Rhythmic Presets</label>
          <select id="preset-select" onchange="loadPreset()">
            <option value="baroque">Baroque Bach Counterpoint</option>
            <option value="jazz">Jazz Blues Scale Riff</option>
            <option value="pentatonic">Asian Pentatonic Folk</option>
            <option value="chopin">Romantic Chopin Nocturne</option>
            <option value="synthwave">Synthwave Arpeggios</option>
            <option value="ambient">Lydian Ambient Float</option>
          </select>
        </div>
      </div>
      <div id="dataset-status" class="status-badge">Dataset Loaded: 48 Notes (Preset)</div>
    </div>

    <div class="card">
      <h3>2. Engine Controls & Sequence Length</h3>
      <div class="grid">
        <div class="form-group">
          <label for="order-select">Markov Order (N-Gram)</label>
          <select id="order-select" onchange="buildMatrix()">
            <option value="1">Order 1 (High Variation / Randomness)</option>
            <option value="2" selected>Order 2 (Balanced Motif Structure)</option>
            <option value="3">Order 3 (Strict Style Cloning)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-input">Tempo (BPM)</label>
          <input type="number" id="tempo-input" value="130" min="40" max="240">
        </div>

        <div class="form-group">
          <label for="length-select">Generation Duration / Note Count</label>
          <select id="length-select">
            <option value="16">16 Notes (Short Motif)</option>
            <option value="32" selected>32 Notes (Standard Phrase)</option>
            <option value="64">64 Notes (Extended Section)</option>
            <option value="128">128 Notes (Full Theme)</option>
            <option value="infinite">Infinite Loop Playback</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>3. Real-Time Visualizer & Playback</h3>
      
      <div class="visualizer-box" id="current-note">--</div>

      <div class="form-group">
        <label>Piano Roll Visualizer</label>
        <canvas id="piano-roll" width="800" height="160"></canvas>
      </div>

      <div class="btn-group">
        <button class="btn" id="play-btn" style="flex: 2;" onclick="togglePlayback()">▶ Play Stream</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="exportMidi()">Export Sequence (.mid)</button>
      </div>

      <div class="form-group">
        <label>Markov Transition Matrix Log</label>
        <div class="log-box" id="log-box">Engine initialized with Rhythmic Note Objects.</div>
      </div>
    </div>
  </div>

  <script>
    // Helper to format pitches into structured Note Objects { pitch, duration (beats), velocity (0-127) }
    function buildRhythmicPreset(pitches, durPattern = [0.25, 0.25, 0.5, 0.25], velPattern = [90, 75, 105, 80]) {
      return pitches.map((p, i) => ({
        pitch: p,
        duration: durPattern[i % durPattern.length],
        velocity: velPattern[i % velPattern.length]
      }));
    }

    const PRESETS = {
      baroque: buildRhythmicPreset([60, 62, 64, 65, 67, 65, 64, 62, 60, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60, 64, 67, 72, 60], [0.25, 0.25, 0.25, 0.25, 0.5, 0.25, 0.25, 0.5], [95, 80, 85, 80, 110, 75, 85, 90]),
      jazz: buildRhythmicPreset([60, 63, 65, 66, 67, 70, 72, 70, 67, 66, 65, 63, 60, 58, 60, 63, 65, 67, 70, 72], [0.33, 0.17, 0.33, 0.17, 0.5, 0.25, 0.25, 0.5], [100, 70, 95, 65, 110, 80, 85, 100]),
      pentatonic: buildRhythmicPreset([60, 62, 65, 67, 69, 72, 69, 67, 65, 62, 60, 65, 67, 72, 69, 65, 62, 60], [0.5, 0.25, 0.25, 0.5, 0.5, 1.0], [90, 80, 85, 95, 85, 105]),
      chopin: buildRhythmicPreset([60, 63, 67, 70, 72, 75, 74, 72, 70, 67, 63, 60, 58, 62, 65, 68, 70, 74, 72], [0.75, 0.25, 0.5, 0.5, 0.25, 0.25, 0.5, 1.0], [85, 65, 90, 80, 70, 75, 95, 100]),
      synthwave: buildRhythmicPreset([48, 60, 48, 63, 48, 65, 48, 67, 48, 65, 48, 63, 48, 60, 48, 58], [0.25, 0.25, 0.25, 0.25], [110, 85, 100, 85]),
      ambient: buildRhythmicPreset([60, 62, 66, 67, 71, 72, 71, 67, 66, 62, 60, 64, 66, 71, 74, 72], [1.0, 0.5, 0.5, 1.0, 1.5, 0.5], [70, 65, 75, 80, 70, 85])
    };

    let dataset = [...PRESETS.baroque];
    let transitionMatrix = {};
    let isPlaying = false;
    let audioCtx = null;
    let timerId = null;
    let currentHistory = [];
    let generatedHistory = [];
    let currentNoteCount = 0;

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const MIN_MIDI = 36;
    const MAX_MIDI = 84;

    function midiToName(midi) {
      const name = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function getNoteStateKey(noteArray) {
      return noteArray.map(n => `${n.pitch}:${n.duration}:${n.velocity}`).join('|');
    }

    function loadPreset() {
      const val = document.getElementById('preset-select').value;
      dataset = [...PRESETS[val]];
      const badge = document.getElementById('dataset-status');
      badge.textContent = `Dataset Loaded: ${dataset.length} Note Objects (Preset)`;
      badge.classList.remove('active');
      buildMatrix();
    }

    function buildMatrix() {
      const order = parseInt(document.getElementById('order-select').value);
      transitionMatrix = {};

      for (let i = 0; i < dataset.length - order; i++) {
        const slice = dataset.slice(i, i + order);
        const stateKey = getNoteStateKey(slice);
        const nextNoteObj = dataset[i + order];

        if (!transitionMatrix[stateKey]) {
          transitionMatrix[stateKey] = [];
        }
        transitionMatrix[stateKey].push(nextNoteObj);
      }

      logMessage(`Matrix rebuilt. Order: ${order}, Total States: ${Object.keys(transitionMatrix).length}, Dataset Size: ${dataset.length}`);
    }

    function logMessage(msg) {
      const logBox = document.getElementById('log-box');
      logBox.innerHTML += `<div>> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function getNextNoteObject() {
      const order = parseInt(document.getElementById('order-select').value);
      
      if (currentHistory.length < order) {
        currentHistory = dataset.slice(0, order);
      }

      // Backoff Strategy: try requested order down to order 1
      for (let currentOrder = order; currentOrder >= 1; currentOrder--) {
        const stateKey = getNoteStateKey(currentHistory.slice(-currentOrder));
        if (transitionMatrix[stateKey] && transitionMatrix[stateKey].length > 0) {
          const options = transitionMatrix[stateKey];
          const chosenObj = options[Math.floor(Math.random() * options.length)];
          currentHistory.push(chosenObj);
          if (currentHistory.length > order * 2) {
            currentHistory = currentHistory.slice(-order);
          }
          return chosenObj;
        }
      }

      // Final Fallback: Random note object from full dataset
      const fallbackObj = dataset[Math.floor(Math.random() * dataset.length)];
      currentHistory.push(fallbackObj);
      return fallbackObj;
    }

    // --- SYNTHESIZER ENGINE ---
    function playSynthNote(noteObj, bpm) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const durationSeconds = (60 / bpm) * noteObj.duration;
      const velocityGain = Math.max(0.1, noteObj.velocity / 127);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(midiToFreq(noteObj.pitch), now);

      // Dynamic Envelope
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.25 * velocityGain, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSeconds);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + durationSeconds);

      return durationSeconds;
    }

    // --- PIANO ROLL CANVAS RENDERING ---
    function drawNoteOnPianoRoll(noteObj) {
      const canvas = document.getElementById('piano-roll');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      const speedPx = Math.max(16, Math.min(64, Math.round(noteObj.duration * 32)));

      // Shift canvas contents left
      const imageData = ctx.getImageData(speedPx, 0, width - speedPx, height);
      ctx.putImageData(imageData, 0, 0);

      // Clear rightmost strip
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(width - speedPx, 0, speedPx, height);

      // Grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i < height; i += 20) {
        ctx.beginPath();
        ctx.moveTo(width - speedPx, i);
        ctx.lineTo(width, i);
        ctx.stroke();
      }

      // Draw active note block
      const clampedPitch = Math.max(MIN_MIDI, Math.min(MAX_MIDI, noteObj.pitch));
      const normalizedPitch = (clampedPitch - MIN_MIDI) / (MAX_MIDI - MIN_MIDI);
      
      const blockHeight = 10;
      const y = height - (normalizedPitch * (height - blockHeight)) - blockHeight;

      const alpha = Math.max(0.4, noteObj.velocity / 127);
      
      ctx.fillStyle = `rgba(139, 92, 246, ${alpha})`;
      ctx.shadowColor = '#8b5cf6';
      ctx.shadowBlur = 8;
      
      ctx.fillRect(width - speedPx + 2, y, speedPx - 4, blockHeight);
      ctx.shadowBlur = 0;
    }

    function clearPianoRoll() {
      const canvas = document.getElementById('piano-roll');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // --- STEP DRIVER ---
    function step() {
      if (!isPlaying) return;

      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const targetLengthVal = document.getElementById('length-select').value;

      if (targetLengthVal !== 'infinite' && currentNoteCount >= parseInt(targetLengthVal)) {
        stopPlayback();
        logMessage(`Completed playback sequence of ${targetLengthVal} notes.`);
        return;
      }

      const noteObj = getNextNoteObject();
      generatedHistory.push(noteObj);
      currentNoteCount++;

      document.getElementById('current-note').textContent = 
        `${midiToName(noteObj.pitch)} | Dur: ${noteObj.duration}b | Vel: ${noteObj.velocity}`;

      drawNoteOnPianoRoll(noteObj);
      const durationSeconds = playSynthNote(noteObj, bpm);

      timerId = setTimeout(step, durationSeconds * 1000);
    }

    async function togglePlayback() {
      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        isPlaying = true;
        currentNoteCount = 0;
        generatedHistory = [];
        currentHistory = [];
        
        clearPianoRoll();
        
        const btn = document.getElementById('play-btn');
        btn.textContent = '⏸ Pause Stream';
        btn.style.backgroundColor = 'var(--danger)';
        step();
      } else {
        stopPlayback();
      }
    }

    function stopPlayback() {
      isPlaying = false;
      clearTimeout(timerId);
      const btn = document.getElementById('play-btn');
      btn.textContent = '▶ Play Stream';
      btn.style.backgroundColor = 'var(--accent)';
    }

    // --- MULTI-FILE MIDI IMPORT ---
    document.getElementById('midi-file').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let combinedNotes = [];
      let parsedCount = 0;

      for (const file of files) {
        try {
          const buffer = await file.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          const parsed = parseFullMidiStream(bytes);
          if (parsed.length > 0) {
            combinedNotes.push(...parsed);
            parsedCount++;
          }
        } catch (err) {
          console.error("Error parsing MIDI file:", file.name, err);
        }
      }

      if (combinedNotes.length > 0) {
        dataset = combinedNotes;
        const badge = document.getElementById('dataset-status');
        badge.textContent = `Dataset Loaded: ${dataset.length} Note Objects (${parsedCount} Files)`;
        badge.classList.add('active');
        buildMatrix();
        logMessage(`Parsed ${parsedCount} MIDI file(s) into ${dataset.length} full Note Objects.`);
      } else {
        alert('Could not extract note events. Ensure files are valid .mid formats.');
      }
    });

    function parseFullMidiStream(bytes) {
      const notes = [];
      let p = 0;

      if (bytes[0] === 0x4d && bytes[1] === 0x54 && bytes[2] === 0x68 && bytes[3] === 0x64) {
        const headerLen = (bytes[4] << 24) | (bytes[5] << 16) | (bytes[6] << 8) | bytes[7];
        p = 8 + headerLen;
      }

      let runningStatus = 0;
      let activeNotesMap = {};

      while (p < bytes.length) {
        if (bytes[p] === 0x4d && bytes[p+1] === 0x54 && bytes[p+2] === 0x72 && bytes[p+3] === 0x6b) {
          p += 8;
          runningStatus = 0;
          continue;
        }

        let delta = 0, b = 0;
        do {
          if (p >= bytes.length) break;
          b = bytes[p++];
          delta = (delta << 7) | (b & 0x7f);
        } while (b & 0x80);

        if (p >= bytes.length) break;

        let status = bytes[p];
        if (status >= 0x80) {
          runningStatus = status;
          p++;
        } else {
          status = runningStatus;
        }

        if (status === 0) continue;
        const msgType = status & 0xF0;

        if (status === 0xFF) {
          p++;
          let len = 0, metaByte = 0;
          do {
            if (p >= bytes.length) break;
            metaByte = bytes[p++];
            len = (len << 7) | (metaByte & 0x7f);
          } while (metaByte & 0x80);
          p += len;
        } else if (status === 0xF0 || status === 0xF7) {
          let len = 0, sysexByte = 0;
          do {
            if (p >= bytes.length) break;
            sysexByte = bytes[p++];
            len = (len << 7) | (sysexByte & 0x7f);
          } while (sysexByte & 0x80);
          p += len;
        } else if (msgType === 0x90) {
          const key = bytes[p++];
          const vel = bytes[p++];
          if (vel > 0 && key >= 21 && key <= 108) {
            notes.push({ pitch: key, duration: 0.25, velocity: vel });
          }
        } else if (msgType === 0x80 || msgType === 0xA0 || msgType === 0xB0 || msgType === 0xE0) {
          p += 2;
        } else if (msgType === 0xC0 || msgType === 0xD0) {
          p += 1;
        }
      }

      return notes;
    }

    // Helper to write Variable Length Quantity for MIDI file creation
    function writeVLQ(val) {
      let buffer = [];
      let v = val;
      buffer.push(v & 0x7F);
      while (v >> 7) {
        v >>= 7;
        buffer.unshift((v & 0x7F) | 0x80);
      }
      return buffer;
    }

    // --- EXPORT FUNCTIONALITY ---
    function exportMidi() {
      const targetLengthVal = document.getElementById('length-select').value;
      const targetCount = targetLengthVal === 'infinite' ? 64 : parseInt(targetLengthVal);
      
      let notesToExport = [];
      if (generatedHistory.length >= targetCount) {
        notesToExport = generatedHistory.slice(0, targetCount);
      } else {
        currentHistory = [];
        notesToExport = [];
        for (let i = 0; i < targetCount; i++) {
          notesToExport.push(getNextNoteObject());
        }
      }

      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const ticksPerQuarter = 96;
      
      const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, ticksPerQuarter];
      const trackHeader = [0x4d, 0x54, 0x72, 0x6b];
      let trackData = [];
      
      const microsecondsPerQuarter = Math.round(60000000 / bpm);
      trackData.push(0x00, 0xFF, 0x51, 0x03, 
        (microsecondsPerQuarter >> 16) & 0xFF,
        (microsecondsPerQuarter >> 8) & 0xFF,
        microsecondsPerQuarter & 0xFF
      );

      notesToExport.forEach(noteObj => {
        const noteTicks = Math.round(noteObj.duration * ticksPerQuarter);
        
        // Note On (Delta-time 0)
        trackData.push(0x00, 0x90, noteObj.pitch, noteObj.velocity);
        
        // Note Off after noteTicks duration
        trackData.push(...writeVLQ(noteTicks), 0x80, noteObj.pitch, 0x00);
      });

      trackData.push(0x00, 0xFF, 0x2F, 0x00);
      const trackLenBytes = [
        (trackData.length >> 24) & 0xFF,
        (trackData.length >> 16) & 0xFF,
        (trackData.length >> 8) & 0xFF,
        trackData.length & 0xFF
      ];

      const blob = new Blob([new Uint8Array([...header, ...trackHeader, ...trackLenBytes, ...trackData])], { type: 'audio/midi' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `markov_rhythmic_sequence_${notesToExport.length}notes.mid`;
      a.click();
      logMessage(`Exported ${notesToExport.length}-note expressive MIDI file.`);
    }

    // Initialize Canvas & Matrix on startup
    clearPianoRoll();
    buildMatrix();
  </script>
</body>
</html>
