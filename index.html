<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Chain Melody Companion</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input, button {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="file"] {
      padding: 0.5rem;
      cursor: pointer;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      background-color: #334155;
      color: var(--text-main);
      width: fit-content;
    }

    .status-badge.active {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .visualizer-box {
      height: 100px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .log-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Markov Chain Melody Companion</h1>
      <p>Multi-File Probabilistic Sequence Synthesizer</p>
    </header>

    <div class="card">
      <h3>1. Training Input Source</h3>
      <div class="grid">
        <div class="form-group">
          <label for="midi-file">Upload MIDI Files (Select Multiple)</label>
          <input type="file" id="midi-file" accept=".mid,.midi" multiple>
        </div>
        <div class="form-group">
          <label for="preset-select">Or Load Built-In Style Presets</label>
          <select id="preset-select" onchange="loadPreset()">
            <option value="baroque">Baroque Bach Counterpoint (48 Notes)</option>
            <option value="jazz">Jazz Blues Scale Riff (36 Notes)</option>
            <option value="pentatonic">Asian Pentatonic Folk (32 Notes)</option>
            <option value="chopin">Romantic Chopin Nocturne (42 Notes)</option>
            <option value="synthwave">Synthwave Arpeggios (32 Notes)</option>
            <option value="ambient">Lydian Ambient Float (36 Notes)</option>
          </select>
        </div>
      </div>
      <div id="dataset-status" class="status-badge">Dataset Loaded: 48 Notes (Preset)</div>
    </div>

    <div class="card">
      <h3>2. Engine Controls & Sequence Length</h3>
      <div class="grid">
        <div class="form-group">
          <label for="order-select">Markov Order (N-Gram)</label>
          <select id="order-select" onchange="buildMatrix()">
            <option value="1">Order 1 (High Variation / Randomness)</option>
            <option value="2" selected>Order 2 (Balanced Motif Structure)</option>
            <option value="3">Order 3 (Strict Style Cloning)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-input">Tempo (BPM)</label>
          <input type="number" id="tempo-input" value="130" min="60" max="220">
        </div>

        <div class="form-group">
          <label for="length-select">Generation Duration / Note Count</label>
          <select id="length-select">
            <option value="16">16 Notes (4 Bars @ 4/4)</option>
            <option value="32" selected>32 Notes (8 Bars @ 4/4)</option>
            <option value="64">64 Notes (16 Bars @ 4/4)</option>
            <option value="128">128 Notes (32 Bars @ 4/4)</option>
            <option value="infinite">Infinite Loop Playback</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>3. Real-Time Playback & Export</h3>
      
      <div class="visualizer-box" id="current-note">--</div>

      <div class="btn-group">
        <button class="btn" id="play-btn" style="flex: 2;" onclick="togglePlayback()">▶ Play Stream</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="exportMidi()">Export Sequence (.mid)</button>
      </div>

      <div class="form-group">
        <label>Markov Transition Matrix Log</label>
        <div class="log-box" id="log-box">Engine initialized. Running status parser active.</div>
      </div>
    </div>
  </div>

  <script>
    // Expanded Datasets
    const PRESETS = {
      baroque: [60, 62, 64, 65, 67, 65, 64, 62, 60, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60, 64, 67, 72, 60, 62, 64, 65, 67, 65, 64, 62, 60, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60, 64, 67, 72, 60, 64],
      jazz: [60, 63, 65, 66, 67, 70, 72, 70, 67, 66, 65, 63, 60, 58, 60, 63, 65, 67, 70, 72, 60, 63, 65, 66, 67, 70, 72, 70, 67, 66, 65, 63, 60, 58, 60, 63],
      pentatonic: [60, 62, 65, 67, 69, 72, 69, 67, 65, 62, 60, 65, 67, 72, 69, 65, 62, 60, 60, 62, 65, 67, 69, 72, 69, 67, 65, 62, 60, 65, 67, 72],
      chopin: [60, 63, 67, 70, 72, 75, 74, 72, 70, 67, 63, 60, 58, 62, 65, 68, 70, 74, 72, 70, 67, 60, 63, 67, 70, 72, 75, 74, 72, 70, 67, 63, 60, 58, 62, 65, 68, 70, 74, 72, 70, 67],
      synthwave: [48, 60, 48, 63, 48, 65, 48, 67, 48, 65, 48, 63, 48, 60, 48, 58, 48, 60, 48, 63, 48, 65, 48, 67, 48, 65, 48, 63, 48, 60, 48, 58],
      ambient: [60, 62, 66, 67, 71, 72, 71, 67, 66, 62, 60, 64, 66, 71, 74, 72, 67, 66, 60, 62, 66, 67, 71, 72, 71, 67, 66, 62, 60, 64, 66, 71, 74, 72, 67, 66]
    };

    let dataset = [...PRESETS.baroque];
    let transitionMatrix = {};
    let isPlaying = false;
    let audioCtx = null;
    let timerId = null;
    let currentHistory = [];
    let generatedHistory = [];
    let currentNoteCount = 0;

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function midiToName(midi) {
      const name = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function loadPreset() {
      const val = document.getElementById('preset-select').value;
      dataset = [...PRESETS[val]];
      const badge = document.getElementById('dataset-status');
      badge.textContent = `Dataset Loaded: ${dataset.length} Notes (Preset)`;
      badge.classList.remove('active');
      buildMatrix();
    }

    function buildMatrix() {
      const order = parseInt(document.getElementById('order-select').value);
      transitionMatrix = {};

      for (let i = 0; i < dataset.length - order; i++) {
        const stateKey = dataset.slice(i, i + order).join(',');
        const nextNote = dataset[i + order];

        if (!transitionMatrix[stateKey]) {
          transitionMatrix[stateKey] = [];
        }
        transitionMatrix[stateKey].push(nextNote);
      }

      logMessage(`Matrix rebuilt. Order: ${order}, Total States: ${Object.keys(transitionMatrix).length}, Dataset Notes: ${dataset.length}`);
    }

    function logMessage(msg) {
      const logBox = document.getElementById('log-box');
      logBox.innerHTML += `<div>> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function getNextNote() {
      const order = parseInt(document.getElementById('order-select').value);
      
      if (currentHistory.length < order) {
        currentHistory = dataset.slice(0, order);
      }

      const stateKey = currentHistory.slice(-order).join(',');
      let options = transitionMatrix[stateKey];

      // Robust fallback if Markov reaches a dead end
      if (!options || options.length === 0) {
        const keys = Object.keys(transitionMatrix);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        options = transitionMatrix[randomKey];
        const keyNotes = randomKey.split(',').map(Number);
        currentHistory = [...keyNotes];
      }

      const chosenNote = options[Math.floor(Math.random() * options.length)];
      currentHistory.push(chosenNote);
      if (currentHistory.length > order * 2) {
        currentHistory = currentHistory.slice(-order);
      }
      return chosenNote;
    }

    function playSynthNote(midiNote, duration) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(midiToFreq(midiNote), audioCtx.currentTime);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration * 0.95);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function step() {
      if (!isPlaying) return;

      const targetLengthVal = document.getElementById('length-select').value;
      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const duration = 60 / bpm;

      if (targetLengthVal !== 'infinite') {
        const maxNotes = parseInt(targetLengthVal);
        if (currentNoteCount >= maxNotes) {
          stopPlayback();
          logMessage(`Completed playback sequence of ${maxNotes} notes.`);
          return;
        }
      }

      const nextNote = getNextNote();
      generatedHistory.push(nextNote);
      currentNoteCount++;

      document.getElementById('current-note').textContent = midiToName(nextNote);
      playSynthNote(nextNote, duration);

      timerId = setTimeout(step, duration * 1000);
    }

    function togglePlayback() {
      if (!isPlaying) {
        isPlaying = true;
        currentNoteCount = 0;
        generatedHistory = [];
        currentHistory = [];
        const btn = document.getElementById('play-btn');
        btn.textContent = '⏸ Pause Stream';
        btn.style.backgroundColor = '#ef4444';
        step();
      } else {
        stopPlayback();
      }
    }

    function stopPlayback() {
      isPlaying = false;
      clearTimeout(timerId);
      const btn = document.getElementById('play-btn');
      btn.textContent = '▶ Play Stream';
      btn.style.backgroundColor = 'var(--accent)';
    }

    // MULTI-FILE MIDI PARSER WITH RUNNING STATUS SUPPORT
    document.getElementById('midi-file').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let combinedNotes = [];
      let parsedCount = 0;

      for (const file of files) {
        try {
          const buffer = await file.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          const parsed = parseFullMidiStream(bytes);
          if (parsed.length > 0) {
            combinedNotes.push(...parsed);
            parsedCount++;
          }
        } catch (err) {
          console.error("Error parsing MIDI file:", file.name, err);
        }
      }

      if (combinedNotes.length > 0) {
        dataset = combinedNotes;
        const badge = document.getElementById('dataset-status');
        badge.textContent = `Dataset Loaded: ${dataset.length} Notes (${parsedCount} Files)`;
        badge.classList.add('active');
        buildMatrix();
        logMessage(`Parsed ${parsedCount} MIDI file(s) into ${dataset.length} total note transitions.`);
      } else {
        alert('Could not extract note events. Ensure files are valid .mid formats.');
      }
    });

    // MIDI Parser supporting Running Status & Variable-Length Delays
    function parseFullMidiStream(bytes) {
      const notes = [];
      let p = 0;

      // Skip MThd header chunk if present
      if (bytes[0] === 0x4d && bytes[1] === 0x54 && bytes[2] === 0x68 && bytes[3] === 0x64) {
        const headerLen = (bytes[4] << 24) | (bytes[5] << 16) | (bytes[6] << 8) | bytes[7];
        p = 8 + headerLen;
      }

      let runningStatus = 0;

      while (p < bytes.length) {
        // Track chunk check (MTrk)
        if (bytes[p] === 0x4d && bytes[p+1] === 0x54 && bytes[p+2] === 0x72 && bytes[p+3] === 0x6b) {
          p += 8; // skip MTrk header + 4 byte track length
          runningStatus = 0;
          continue;
        }

        // Parse variable-length quantity (delta-time)
        let delta = 0;
        let b = 0;
        do {
          if (p >= bytes.length) break;
          b = bytes[p++];
          delta = (delta << 7) | (b & 0x7f);
        } while (b & 0x80);

        if (p >= bytes.length) break;

        let status = bytes[p];
        if (status >= 0x80) {
          runningStatus = status;
          p++;
        } else {
          status = runningStatus; // Running status applied!
        }

        if (status === 0) continue;

        const msgType = status & 0xF0;

        // Meta Events (0xFF) or System Exclusive (0xF0 / 0xF7)
        if (status === 0xFF) {
          p++; // meta type
          let len = 0, metaByte = 0;
          do {
            if (p >= bytes.length) break;
            metaByte = bytes[p++];
            len = (len << 7) | (metaByte & 0x7f);
          } while (metaByte & 0x80);
          p += len;
        } else if (status === 0xF0 || status === 0xF7) {
          let len = 0, sysexByte = 0;
          do {
            if (p >= bytes.length) break;
            sysexByte = bytes[p++];
            len = (len << 7) | (sysexByte & 0x7f);
          } while (sysexByte & 0x80);
          p += len;
        } 
        // Note On Event
        else if (msgType === 0x90) {
          const key = bytes[p++];
          const vel = bytes[p++];
          if (vel > 0 && key >= 21 && key <= 108) {
            notes.push(key);
          }
        } 
        // Note Off or 2-byte messages
        else if (msgType === 0x80 || msgType === 0xA0 || msgType === 0xB0 || msgType === 0xE0) {
          p += 2;
        } 
        // 1-byte messages
        else if (msgType === 0xC0 || msgType === 0xD0) {
          p += 1;
        }
      }

      return notes;
    }

    // Export generated sequence based on selected length
    function exportMidi() {
      const targetLengthVal = document.getElementById('length-select').value;
      const targetCount = targetLengthVal === 'infinite' ? 64 : parseInt(targetLengthVal);
      
      let notesToExport = [];

      if (generatedHistory.length >= targetCount) {
        notesToExport = generatedHistory.slice(0, targetCount);
      } else {
        // Generate complete batch to match requested length exactly
        currentHistory = [];
        notesToExport = [];
        for (let i = 0; i < targetCount; i++) {
          notesToExport.push(getNextNote());
        }
      }

      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
      const trackHeader = [0x4d, 0x54, 0x72, 0x6b];
      let trackData = [];
      
      const microsecondsPerQuarter = Math.round(60000000 / bpm);
      trackData.push(0x00, 0xFF, 0x51, 0x03, 
        (microsecondsPerQuarter >> 16) & 0xFF,
        (microsecondsPerQuarter >> 8) & 0xFF,
        microsecondsPerQuarter & 0xFF
      );

      notesToExport.forEach(note => {
        trackData.push(0x00, 0x90, note, 0x5A); // Note On
        trackData.push(0x60, 0x80, note, 0x00); // Note Off quarter note duration
      });

      trackData.push(0x00, 0xFF, 0x2F, 0x00);
      const trackLenBytes = [
        (trackData.length >> 24) & 0xFF,
        (trackData.length >> 16) & 0xFF,
        (trackData.length >> 8) & 0xFF,
        trackData.length & 0xFF
      ];

      const blob = new Blob([new Uint8Array([...header, ...trackHeader, ...trackLenBytes, ...trackData])], { type: 'audio/midi' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `markov_sequence_${notesToExport.length}notes.mid`;
      a.click();
      logMessage(`Exported ${notesToExport.length}-note MIDI file.`);
    }

    buildMatrix();
  </script>
</body>
</html>
