<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Chain Melody Companion</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input, button {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="file"] {
      padding: 0.5rem;
      cursor: pointer;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
      background-color: #334155;
      color: var(--text-main);
      width: fit-content;
    }

    .status-badge.active {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .visualizer-box {
      height: 100px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .log-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Markov Chain Melody Companion</h1>
      <p>Probabilistic Algorithmic Sequence Generator</p>
    </header>

    <div class="card">
      <h3>1. Training Input Source</h3>
      <div class="grid">
        <div class="form-group">
          <label for="midi-file">Upload MIDI File (.mid)</label>
          <input type="file" id="midi-file" accept=".mid,.midi">
        </div>
        <div class="form-group">
          <label for="preset-select">Or Load Built-In Style Preset</label>
          <select id="preset-select" onchange="loadPreset()">
            <option value="baroque">Baroque Bach Counterpoint</option>
            <option value="jazz">Jazz Blues Scale Riff</option>
            <option value="pentatonic">Asian Pentatonic Folk</option>
          </select>
        </div>
      </div>
      <div id="dataset-status" class="status-badge">Dataset Loaded: 24 Notes Analyzed</div>
    </div>

    <div class="card">
      <h3>2. Engine Controls</h3>
      <div class="grid">
        <div class="form-group">
          <label for="order-select">Markov Order (N-Gram)</label>
          <select id="order-select" onchange="buildMatrix()">
            <option value="1">Order 1 (Higher Variation / Randomness)</option>
            <option value="2" selected>Order 2 (Balanced Motif Structure)</option>
            <option value="3">Order 3 (Strict Style Cloning)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-input">Tempo (BPM)</label>
          <input type="number" id="tempo-input" value="130" min="60" max="220">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>3. Real-Time Playback & Export</h3>
      
      <div class="visualizer-box" id="current-note">--</div>

      <div class="btn-group">
        <button class="btn" id="play-btn" style="flex: 2;" onclick="togglePlayback()">▶ Play Infinite Stream</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="exportMidi()">Export Generated Track (.mid)</button>
      </div>

      <div class="form-group">
        <label>Markov Transition Matrix Log</label>
        <div class="log-box" id="log-box">Engine initialized. Ready to generate...</div>
      </div>
    </div>
  </div>

  <script>
    // Built-in Training Datasets (MIDI Note Numbers)
    const PRESETS = {
      baroque: [60, 62, 64, 65, 67, 65, 64, 62, 60, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60, 64, 67, 72],
      jazz: [60, 63, 65, 66, 67, 70, 72, 70, 67, 66, 65, 63, 60, 58, 60, 63, 65, 67, 70, 72],
      pentatonic: [60, 62, 65, 67, 69, 72, 69, 67, 65, 62, 60, 65, 67, 72, 69, 65, 62, 60]
    };

    let dataset = [...PRESETS.baroque];
    let transitionMatrix = {};
    let isPlaying = false;
    let audioCtx = null;
    let timerId = null;
    let currentHistory = [];
    let generatedHistory = [];

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function midiToName(midi) {
      const name = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function loadPreset() {
      const val = document.getElementById('preset-select').value;
      dataset = [...PRESETS[val]];
      document.getElementById('dataset-status').textContent = `Dataset Loaded: ${dataset.length} Notes Analyzed`;
      buildMatrix();
    }

    // Build N-Order Markov Transition Matrix
    function buildMatrix() {
      const order = parseInt(document.getElementById('order-select').value);
      transitionMatrix = {};

      for (let i = 0; i < dataset.length - order; i++) {
        const stateKey = dataset.slice(i, i + order).join(',');
        const nextNote = dataset[i + order];

        if (!transitionMatrix[stateKey]) {
          transitionMatrix[stateKey] = [];
        }
        transitionMatrix[stateKey].push(nextNote);
      }

      logMessage(`Matrix built. Order: ${order}, Total States: ${Object.keys(transitionMatrix).length}`);
    }

    function logMessage(msg) {
      const logBox = document.getElementById('log-box');
      logBox.innerHTML += `<div>> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Predict Next Note using Weighted Markov Sampling
    function getNextNote() {
      const order = parseInt(document.getElementById('order-select').value);
      
      if (currentHistory.length < order) {
        currentHistory = dataset.slice(0, order);
      }

      const stateKey = currentHistory.slice(-order).join(',');
      let options = transitionMatrix[stateKey];

      // Fallback if sequence hits a state with no known transitions
      if (!options || options.length === 0) {
        const randIndex = Math.floor(Math.random() * dataset.length);
        const fallbackNote = dataset[randIndex];
        currentHistory.push(fallbackNote);
        return fallbackNote;
      }

      const chosenNote = options[Math.floor(Math.random() * options.length)];
      currentHistory.push(chosenNote);
      return chosenNote;
    }

    // Synthesize Live Synth Sound
    function playSynthNote(midiNote, duration) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(midiToFreq(midiNote), audioCtx.currentTime);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration * 0.95);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function step() {
      if (!isPlaying) return;

      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const duration = 60 / bpm;

      const nextNote = getNextNote();
      generatedHistory.push(nextNote);

      // Render Note Display
      const noteName = midiToName(nextNote);
      document.getElementById('current-note').textContent = noteName;

      playSynthNote(nextNote, duration);

      timerId = setTimeout(step, duration * 1000);
    }

    function togglePlayback() {
      const btn = document.getElementById('play-btn');
      
      if (!isPlaying) {
        isPlaying = true;
        btn.textContent = '⏸ Pause Stream';
        btn.style.backgroundColor = '#ef4444';
        step();
      } else {
        isPlaying = false;
        clearTimeout(timerId);
        btn.textContent = '▶ Play Infinite Stream';
        btn.style.backgroundColor = 'var(--accent)';
      }
    }

    // Handle Uploaded MIDI Binary Parser
    document.getElementById('midi-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const bytes = new Uint8Array(evt.target.result);
        const parsedNotes = parseMidiFileNotes(bytes);

        if (parsedNotes.length > 0) {
          dataset = parsedNotes;
          document.getElementById('dataset-status').textContent = `Dataset Loaded: ${dataset.length} Custom File Notes`;
          document.getElementById('dataset-status').classList.add('active');
          buildMatrix();
          logMessage(`Successfully parsed ${parsedNotes.length} notes from uploaded MIDI.`);
        } else {
          alert('Could not extract note events from file.');
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // Parse Pitch Sequence from standard MIDI binary bytes
    function parseMidiFileNotes(bytes) {
      const notes = [];
      for (let i = 0; i < bytes.length - 2; i++) {
        // Look for Note On commands (0x90) with velocity > 0
        if ((bytes[i] & 0xF0) === 0x90 && bytes[i + 2] > 0) {
          const pitch = bytes[i + 1];
          if (pitch >= 21 && pitch <= 108) {
            notes.push(pitch);
          }
        }
      }
      return notes;
    }

    // Export Generated Stream as MIDI file
    function exportMidi() {
      if (generatedHistory.length === 0) {
        alert('Generate some notes by playing the stream first.');
        return;
      }

      const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
      const header = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
      const trackHeader = [0x4d, 0x54, 0x72, 0x6b];
      let trackData = [];
      
      const microsecondsPerQuarter = Math.round(60000000 / bpm);
      trackData.push(0x00, 0xFF, 0x51, 0x03, 
        (microsecondsPerQuarter >> 16) & 0xFF,
        (microsecondsPerQuarter >> 8) & 0xFF,
        microsecondsPerQuarter & 0xFF
      );

      generatedHistory.forEach(note => {
        trackData.push(0x00, 0x90, note, 0x5A); // Note On
        trackData.push(0x60, 0x80, note, 0x00); // Note Off after quarter note
      });

      trackData.push(0x00, 0xFF, 0x2F, 0x00);
      const trackLenBytes = [
        (trackData.length >> 24) & 0xFF,
        (trackData.length >> 16) & 0xFF,
        (trackData.length >> 8) & 0xFF,
        trackData.length & 0xFF
      ];

      const blob = new Blob([new Uint8Array([...header, ...trackHeader, ...trackLenBytes, ...trackData])], { type: 'audio/midi' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'markov_generated_sequence.mid';
      a.click();
    }

    // Initialize default state
    buildMatrix();
  </script>
</body>
</html>
